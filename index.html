<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="todo-app">
        <header class="app-header">
          <div>
            <p class="eyebrow">Productivity</p>
            <h1>To-Do List</h1>
          </div>
          <span id="task-count" class="task-count">0 tasks</span>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task..."
            aria-label="Add a new task"
            maxlength="180"
            required
          />
          <button type="submit">Add Task</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
          <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state hidden">
          <p>No tasks yet. Add one above to get started.</p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
